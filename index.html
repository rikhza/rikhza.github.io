<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting • zaa.is-a.dev</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --fg: #eaeaea;
        --muted: #9aa0a6;
        --accent: #a0e8ff; /* soft cyan accent like zaa.is-a.dev vibe */
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
        overflow: hidden;
      }
      /* Subtle vignette & grain to keep it elegant */
      .backdrop {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(1200px 800px at 50% 40%, rgba(160,232,255,0.06), transparent 60%),
                    radial-gradient(900px 600px at 80% 80%, rgba(160,232,255,0.04), transparent 60%),
                    radial-gradient(900px 600px at 20% 80%, rgba(160,232,255,0.04), transparent 60%);
        mix-blend-mode: screen; filter: saturate(110%);
      }
      .vignette { position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(1000px 700px at 50% 50%, transparent 40%, rgba(0,0,0,.35) 100%);
      }
      /* UI overlay */
      .ui {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
      }
      .panel {
        display: grid; gap: 12px; text-align: center; backdrop-filter: blur(6px);
        background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
        border: 1px solid rgba(255,255,255,.08); box-shadow: 0 10px 40px rgba(0,0,0,.35);
        border-radius: 18px; padding: 22px 26px;
      }
      .brand {
        letter-spacing: .12em; text-transform: uppercase; font-weight: 600;
        font-size: 12px; color: var(--muted);
      }
      .headline { font-size: clamp(18px, 2.6vw, 28px); font-weight: 600; }
      .accent { color: var(--accent); }
      .count {
        font-variant-numeric: tabular-nums; font-weight: 700; font-size: clamp(38px, 6.5vw, 64px);
        line-height: 1; text-shadow: 0 0 24px rgba(160,232,255,.35);
      }
      .sub { color: var(--muted); font-size: 14px; }
      .skip {
        margin-top: 6px; font-size: 12px; color: var(--muted);
        opacity: .7; transition: opacity .2s ease; text-decoration: none;
        border-bottom: 1px dotted rgba(160,232,255,.35);
      }
      .skip:hover { opacity: 1; color: var(--fg); }
      /* Canvas holds the WebGL scene */
      #stage { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      .fade-out { animation: fade .75s ease forwards; }
      @keyframes fade { to { opacity: 0; filter: blur(8px); } }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div class="backdrop"></div>
    <div class="vignette"></div>

    <div class="ui">
      <div class="panel">
        <div class="brand">RZ • Redirect</div>
        <div class="headline">Mengantar ke <span class="accent">Portfolio</span></div>
        <div id="count" class="count">3</div>
        <div class="sub">Kamu akan diarahkan ke <span class="accent">zaa.is-a.dev</span> dalam beberapa detik…</div>
        <a class="skip" href="https://zaa.is-a.dev" id="skip">Langsung saja →</a>
      </div>
    </div>

    <!-- Three.js (ESM) + helpers -->
    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
      import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
      import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/postprocessing/EffectComposer.js';
      import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/postprocessing/RenderPass.js';
      import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/postprocessing/UnrealBloomPass.js';
      import { FXAAShader } from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/shaders/FXAAShader.js';
      import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/postprocessing/ShaderPass.js';

      // --- Scene setup ---
      const stage = document.getElementById('stage');
      const scene = new THREE.Scene();

      // Subtle fog to push depth
      scene.fog = new THREE.Fog(new THREE.Color('#050505'), 12, 48);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(0, 0.8, 5.2);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      stage.appendChild(renderer.domElement);

      // Gradient environment via custom cube texture (procedural)
      const grad = new THREE.CanvasTexture(gradientCanvas());
      grad.wrapS = grad.wrapT = THREE.MirroredRepeatWrapping;
      grad.needsUpdate = true;

      // Lighting: rim + fill
      const hemi = new THREE.HemisphereLight(0xa0e8ff, 0x080808, 0.6);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xa0e8ff, 1.2);
      dir.position.set(2.5, 3.5, 2.5);
      scene.add(dir);

      // Floor - glossy plane to reflect a bit
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 60),
        new THREE.MeshStandardMaterial({ color: 0x0b0b0b, metalness: 0.8, roughness: 0.4, envMap: grad })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -1.25;
      scene.add(floor);

      // Signature object: beveled torus-knot + wireframe shell (looks techy/elegant)
      const knotGeo = new THREE.TorusKnotGeometry(1, 0.26, 300, 42, 2, 3);
      const baseMat = new THREE.MeshPhysicalMaterial({
        color: 0x111111,
        metalness: 1,
        roughness: 0.15,
        reflectivity: 0.9,
        transmission: 0,
        envMap: grad,
        clearcoat: 1,
        clearcoatRoughness: 0.15,
      });
      const accentMat = new THREE.MeshBasicMaterial({ color: 0xa0e8ff, wireframe: true, transparent: true, opacity: 0.35 });

      const knot = new THREE.Mesh(knotGeo, baseMat);
      scene.add(knot);
      const shell = new THREE.Mesh(knotGeo, accentMat);
      shell.scale.setScalar(1.015);
      scene.add(shell);

      // Floating shards (instanced) for subtle parallax
      const shardGeo = new THREE.OctahedronGeometry(0.03, 0);
      const shardMat = new THREE.MeshBasicMaterial({ color: 0xa0e8ff, transparent: true, opacity: 0.55 });
      const shards = new THREE.InstancedMesh(shardGeo, shardMat, 800);
      const dummy = new THREE.Object3D();
      for (let i = 0; i < shards.count; i++) {
        const r = THREE.MathUtils.randFloat(3.5, 18);
        const a = Math.random() * Math.PI * 2;
        const y = THREE.MathUtils.randFloatSpread(8);
        dummy.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
        dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
        const s = THREE.MathUtils.randFloat(0.6, 1.8);
        dummy.scale.setScalar(s);
        dummy.updateMatrix();
        shards.setMatrixAt(i, dummy.matrix);
      }
      scene.add(shards);

      // Post-processing: render + bloom + FXAA (kept subtle)
      const composer = new EffectComposer(renderer);
      const renderPass = new RenderPass(scene, camera);
      composer.addPass(renderPass);
      const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.4, 0.85);
      composer.addPass(bloom);
      const fxaa = new ShaderPass(FXAAShader);
      fxaa.material.uniforms['resolution'].value.set(1 / window.innerWidth, 1 / window.innerHeight);
      composer.addPass(fxaa);

      // Minimal controls for subtle auto-orbit (disabled interactions for purity)
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableZoom = false; controls.enablePan = false; controls.enableDamping = true; controls.dampingFactor = 0.06;
      controls.minPolarAngle = Math.PI/2.8; controls.maxPolarAngle = Math.PI/2.2;
      controls.autoRotate = true; controls.autoRotateSpeed = 0.3;

      // Cursor parallax
      const target = new THREE.Vector2();
      window.addEventListener('pointermove', (e) => {
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = (e.clientY / window.innerHeight) * 2 - 1;
        target.set(x, y);
      });

      // Animation loop
      const clock = new THREE.Clock();
      function tick() {
        const t = clock.getElapsedTime();
        knot.rotation.x = t * 0.25; // elegant slow motion
        knot.rotation.y = t * 0.32;
        shell.rotation.copy(knot.rotation);

        // gentle camera sway
        camera.position.x += (target.x * 0.6 - camera.position.x) * 0.02;
        camera.position.y += (0.8 + target.y * 0.2 - camera.position.y) * 0.02;
        camera.lookAt(0, 0, 0);

        controls.update();
        composer.render();
        requestAnimationFrame(tick);
      }
      tick();

      // Handle resize
      window.addEventListener('resize', onResize);
      function onResize() {
        const w = window.innerWidth, h = window.innerHeight;
        camera.aspect = w / h; camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        composer.setSize(w, h);
        fxaa.material.uniforms['resolution'].value.set(1 / w, 1 / h);
      }

      // --- Countdown + redirect ---
      const COUNTDOWN_SECONDS = 3; // ⬅️ edit this if you want longer/shorter
      const TARGET_URL = 'https://zaa.is-a.dev';
      const countEl = document.getElementById('count');
      const skip = document.getElementById('skip');
      skip.addEventListener('click', onLeave);

      let timeLeft = COUNTDOWN_SECONDS;
      countEl.textContent = timeLeft;
      const interval = setInterval(() => {
        timeLeft -= 1;
        countEl.textContent = Math.max(0, timeLeft);
        if (timeLeft <= 0) { clearInterval(interval); onLeave(); }
      }, 1000);

      function onLeave() {
        // graceful fade before navigation
        document.body.classList.add('fade-out');
        setTimeout(() => { window.location.href = TARGET_URL; }, 620);
      }

      // --- helpers ---
      function gradientCanvas() {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 512; const g = c.getContext('2d');
        const grad = g.createLinearGradient(0, 0, 512, 512);
        grad.addColorStop(0, '#0b0b0b');
        grad.addColorStop(0.45, '#0d1214');
        grad.addColorStop(1, '#091013');
        g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
        // a soft cyan glow dot
        const r = g.createRadialGradient(380, 160, 20, 380, 160, 220);
        r.addColorStop(0, 'rgba(160,232,255,.28)');
        r.addColorStop(1, 'rgba(160,232,255,0)');
        g.fillStyle = r; g.beginPath(); g.arc(380,160,220,0,Math.PI*2); g.fill();
        return c;
      }
    </script>
  </body>
</html>
